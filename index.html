<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="calculator-app">
        <!-- History Panel (Toggleable Drawer) -->
        <aside class="history-panel" id="historyPanel" aria-label="Calculation history">
            <header class="history-header">
                <h2>History</h2>
                <button class="history-close-btn" id="historyCloseBtn" aria-label="Close history panel">✕</button>
            </header>
            <ul class="history-list" id="historyList">
                <!-- History items will be inserted dynamically -->
            </ul>
            <button class="clear-history-btn" id="clearHistoryBtn" aria-label="Clear all history">
                Clear History
            </button>
        </aside>

        <!-- Overlay for mobile history -->
        <div class="history-overlay" id="historyOverlay"></div>

        <!-- Main Calculator -->
        <section class="calculator">
            <!-- Top Toolbar -->
                        <!-- Top Toolbar with App Title -->
            <header class="toolbar">
                <div class="app-title">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="2" width="16" height="20" rx="3"></rect>
                        <line x1="8" y1="6" x2="16" y2="6"></line>
                        <line x1="16" y1="14" x2="16" y2="18"></line>
                        <path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"></path>
                    </svg>
                    <h1>Scientific Calculator</h1>
                </div>

                <div class="toolbar-actions">
                    <button class="tool-btn" id="historyToggleBtn" aria-label="Toggle history panel">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span class="tool-label">History</span>
                    </button>
                    <button class="tool-btn" id="themeToggleBtn" aria-label="Toggle light/dark theme">
                        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>
                    <button class="tool-btn" id="copyBtn" aria-label="Copy result to clipboard">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Display Section -->
            <section class="display" aria-label="Calculator display">
                <div class="indicators">
                    <span class="indicator-mode" id="modeIndicator">DEG</span>
                    <span class="indicator-memory" id="memIndicator" aria-label="Memory has value"></span>
                    <span class="indicator-shift" id="shiftIndicator"></span>
                </div>
                <div class="expression-line" id="expression" aria-label="Current expression"></div>
                <div class="result-line" id="result" aria-live="polite">0</div>
            </section>

            <!-- All Buttons Container - Single Event Delegation Target -->
            <section class="keys-container" id="keys">

                <!-- Memory Row -->
                <div class="key-row memory-row">
                    <button class="btn btn-memory" data-action="mc" aria-label="Memory clear">MC</button>
                    <button class="btn btn-memory" data-action="mr" aria-label="Memory recall">MR</button>
                    <button class="btn btn-memory" data-action="m-plus" aria-label="Memory add">M+</button>
                    <button class="btn btn-memory" data-action="m-minus" aria-label="Memory subtract">M−</button>
                </div>

                <!-- Scientific Functions Grid -->
                <div class="key-grid scientific-grid">
                    <button class="btn btn-function" data-action="second" aria-label="Second function toggle">2nd</button>
                    <button class="btn btn-function" data-action="sin" aria-label="Sine">sin</button>
                    <button class="btn btn-function" data-action="cos" aria-label="Cosine">cos</button>
                    <button class="btn btn-function" data-action="tan" aria-label="Tangent">tan</button>

                    <button class="btn btn-function" data-action="square" aria-label="Square">x²</button>
                    <button class="btn btn-function" data-action="power" aria-label="Power">xʸ</button>
                    <button class="btn btn-function" data-action="sqrt" aria-label="Square root">√</button>
                    <button class="btn btn-function" data-action="factorial" aria-label="Factorial">n!</button>

                    <button class="btn btn-function" data-action="log" aria-label="Logarithm base 10">log</button>
                    <button class="btn btn-function" data-action="ln" aria-label="Natural logarithm">ln</button>
                    <button class="btn btn-function" data-value="pi" aria-label="Pi constant">π</button>
                    <button class="btn btn-function" data-value="e" aria-label="Euler's number">e</button>

                    <button class="btn btn-function" data-action="reciprocal" aria-label="Reciprocal">1/x</button>
                    <button class="btn btn-function" data-action="percent" aria-label="Percentage">%</button>
                    <button class="btn btn-function" data-action="toggle-mode" aria-label="Toggle degree/radian mode" id="modeBtn">DEG</button>
                    <button class="btn btn-function" data-action="open-paren" aria-label="Open parenthesis">(</button>
                </div>

                <!-- Main Keypad Grid -->
                <div class="key-grid main-grid">
                    <button class="btn btn-action" data-action="clear" aria-label="Clear all">AC</button>
                    <button class="btn btn-action" data-action="delete" aria-label="Delete last character">DEL</button>
                    <button class="btn btn-action" data-action="close-paren" aria-label="Close parenthesis">)</button>
                    <button class="btn btn-operator" data-value="÷" aria-label="Divide">÷</button>

                    <button class="btn btn-number" data-value="7">7</button>
                    <button class="btn btn-number" data-value="8">8</button>
                    <button class="btn btn-number" data-value="9">9</button>
                    <button class="btn btn-operator" data-value="×" aria-label="Multiply">×</button>

                    <button class="btn btn-number" data-value="4">4</button>
                    <button class="btn btn-number" data-value="5">5</button>
                    <button class="btn btn-number" data-value="6">6</button>
                    <button class="btn btn-operator" data-value="−" aria-label="Subtract">−</button>

                    <button class="btn btn-number" data-value="1">1</button>
                    <button class="btn btn-number" data-value="2">2</button>
                    <button class="btn btn-number" data-value="3">3</button>
                    <button class="btn btn-operator" data-value="+" aria-label="Add">+</button>

                    <!-- btn-zero class removed below -->
                    <button class="btn btn-number" data-value="0">0</button>
                    <button class="btn btn-number" data-value=".">.</button>
                    <button class="btn btn-action" data-action="negate" aria-label="Toggle sign">±</button>
                    <button class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>
                </div>
            </section>
        </section>
    </main>

    <script src="/javascript/evaluator.js"></script>
    <script src="javascript/app.js"></script>
</body>
</html>
